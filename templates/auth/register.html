{% extends "layout/base.html" %}
{% block content %}

<div class="page-bg register-bg">
    <div class="auth-container">

        <div class="login-card register-card p-5">

            <!-- Page title -->
            <h2 class="neon-text mb-4">Register</h2>

            <form method="POST">

                <!-- user name -->
                <input
                    type="text"
                    name="name"
                    class="form-control mb-3"
                    placeholder="Full Name"
                    required
                >

                <!-- user email -->
                <input
                    type="email"
                    name="email"
                    class="form-control mb-3"
                    placeholder="Enter Email"
                    required
                >

                <button class="btn btn-primary w-100">
                    Register
                </button>

                <!-- login redirect -->
                <div class="mt-3 text-center">
                    <a href="/login" class="text-info">
                        Already have an account? Login
                    </a>
                </div>

            </form>

        </div>

    </div>
</div>

{% endblock %}
